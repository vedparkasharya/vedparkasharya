name: Profile Views Counter

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight IST
  workflow_dispatch:

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Profile Views Badge
        run: |
          echo "Profile views badge updated automatically"
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Auto-update profile metrics [$(date -u '+%Y-%m-%d')]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
